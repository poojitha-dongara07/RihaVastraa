<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - RihaVastraa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to left, rgba(0,0,0,0.9) 45%, rgba(0,0,0,0.2)),
                        url("1.jpeg") no-repeat center top;
            background-size: cover;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: transparent;
            padding-top: 20px;
        }

        .logo {
            color: #f3d5ab;
            font-weight: bold;
            font-size: 22px;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 120px 120px 60px 0;
        }

        .signup-card {
            background: rgba(0,0,0,0.7);
            padding: 40px;
            border-radius: 20px;
            color: white;
            backdrop-filter: blur(10px);
        }

        .form-control {
            border-radius: 30px;
            padding: 12px 20px;
        }

        .btn-signup {
            border-radius: 30px;
            padding: 10px;
            background-color: #f3d5ab;
            border: none;
            font-weight: 600;
        }

        .btn-signup:hover {
            background-color: white;
        }

        a {
            text-decoration: none;
            color: #f3d5ab;
        }

        a:hover {
            color: white;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-5">
    <div class="container-fluid">
        <span class="logo">RihaVastraa</span>
        <div class="ms-auto">
            <a href="../mainproject/index.html" class="text-white me-4">Home</a>
            <a href="#" class="text-white me-4">About</a>
            <a href="#" class="text-white me-4">Portfolio</a>
            <a href="#" class="text-white">Contact</a>
        </div>
    </div>
</nav>

<!-- Signup Section -->
<div class="container-fluid page-wrapper">
    <div class="col-md-4">
        <div class="signup-card text-center">

            <h2 class="mb-3">
                <span style="color:#f3d5ab;">Create</span> Account
            </h2>

            <p class="mb-4">Sign up to start shopping</p>

            <form id="signupForm" class="needs-validation" novalidate>

                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Full Name" required>
                    <div class="invalid-feedback">Please enter your full name.</div>
                </div>

                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Email" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <div class="mb-3">
                    <input type="tel" class="form-control" placeholder="Mobile Number" required>
                    <div class="invalid-feedback">Please enter mobile number.</div>
                </div>

                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                    <div class="invalid-feedback">Please enter password.</div>
                </div>

                <div class="mb-3">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
                    <div class="invalid-feedback">Passwords must match.</div>
                </div>

                <div class="mb-3 form-check text-start small">
                    <input type="checkbox" class="form-check-input" required>
                    <label class="form-check-label">I agree to Terms & Conditions</label>
                    <div class="invalid-feedback">You must agree before submitting.</div>
                </div>

                <button type="submit" class="btn btn-signup w-100">
                    Create Account
                </button>

            </form>

            <p class="mt-4">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </div>
</div>

<!-- Bootstrap Validation Script -->
<script>
(() => {
  'use strict';

  const form = document.getElementById('signupForm');

  form.addEventListener('submit', function (event) {

    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    // Check password match
    if (password.value !== confirmPassword.value) {
        confirmPassword.setCustomValidity("Passwords do not match");
    } else {
        confirmPassword.setCustomValidity("");
    }

    if (!form.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
    } else {
      event.preventDefault();
      window.location.href = "../mainproject/index.html";
    }

    form.classList.add('was-validated');

  }, false);
})();
</script>

</body>
</html>
