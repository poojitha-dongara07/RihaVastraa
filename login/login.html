<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - RihaVastraa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to left, rgba(0,0,0,0.9) 45%, rgba(0,0,0,0.2)),
                        url("1.jpeg") no-repeat center top;
            background-size: cover;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: transparent;
            padding-top: 20px;
        }

        .logo {
            color: #f3d5ab;
            font-weight: bold;
            font-size: 22px;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 120px 120px 60px 0;
        }

        .login-card {
            background: rgba(0,0,0,0.7);
            padding: 40px;
            border-radius: 20px;
            color: white;
            backdrop-filter: blur(10px);
        }

        .form-control {
            border-radius: 30px;
            padding: 12px 20px;
        }

        .btn-login {
            border-radius: 30px;
            padding: 10px;
            background-color: #f3d5ab;
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: white;
        }

        a {
            text-decoration: none;
            color: #f3d5ab;
        }

        a:hover {
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg px-5">
    <div class="container-fluid">
        <span class="logo">RihaVastraa</span>
        <div class="ms-auto">
            <a href="index.html" class="text-white me-4">Home</a>
            <a href="about.html" class="text-white me-4">About</a>
            <a href="portfolio.html" class="text-white me-4">Portfolio</a>
            <a href="contact.html" class="text-white">Contact</a>
        </div>
    </div>
</nav>

<div class="container-fluid page-wrapper">
    <div class="col-md-4">
        <div class="login-card text-center">

            <h2 class="mb-3">
                <span style="color:#f3d5ab;">Welcome</span> Back
            </h2>

            <p class="mb-4">Login to continue shopping</p>

            <form id="loginForm">

                <div class="mb-3">
                    <input type="email" class="form-control" placeholder="Email" required>
                </div>

                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Password" required>
                </div>

                <div class="d-flex justify-content-between mb-3 small">
                    <div>
                        <input type="checkbox"> Remember me
                    </div>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-login w-100">
                    Login
                </button>

            </form>

            <p class="mt-4">
                Don’t have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    window.location.href = "../mainproject/index.html";
});
</script>

</body>
</html>
