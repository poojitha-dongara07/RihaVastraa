<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f5f5f6;
    font-family: 'Poppins', sans-serif;
}

/* ── LOCATION BAR ── */
.location-bar {
    background: #fff;
    padding: 12px 15px;
    border-bottom: 1px solid #ddd;
    font-weight: 600;
    font-size: 14px;
}

/* ── CART CARD ── */
.cart-card {
    display: flex;
    background: #fff;
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.cart-img {
    width: 100px;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.cart-details {
    margin-left: 12px;
    flex: 1;
}

.cart-name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
    color: #222;
}

.cart-price {
    color: #ff3f6c;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 6px;
}

.cart-size {
    font-size: 13px;
    color: #666;
    margin: 4px 0;
}

.remove-btn {
    border: none;
    background: none;
    color: #ff3f6c;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
}

.remove-btn:hover {
    text-decoration: underline;
}

#cart-items {
    margin-bottom: 10px;
}

/* ── SECTION CARDS ── */
.section-card {
    background: #fff;
    margin: 10px;
    padding: 16px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.section-card h6 {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 14px;
    color: #222;
    border-bottom: 2px solid #ff3f6c;
    padding-bottom: 8px;
}

/* ── FORM ── */
.form-label {
    font-size: 12px;
    font-weight: 600;
    color: #555;
    margin-bottom: 4px;
}

.form-control {
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #ddd;
    padding: 9px 12px;
}

.form-control:focus {
    border-color: #ff3f6c;
    box-shadow: 0 0 0 0.2rem rgba(255,63,108,0.15);
    outline: none;
}

.form-control[readonly] {
    background: #f9f9f9;
    color: #888;
}

.form-check-input:checked {
    background-color: #ff3f6c;
    border-color: #ff3f6c;
}

.addr-type-label {
    font-size: 13px;
    cursor: pointer;
}

/* ── PAYMENT ── */
.payment-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    background: #fff9fb;
}

.payment-icon {
    font-size: 24px;
}

.payment-title {
    font-weight: 700;
    font-size: 14px;
    color: #222;
}

.payment-sub {
    font-size: 12px;
    color: #888;
}

/* ── ORDER SUMMARY ── */
.summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
    color: #444;
}

.summary-divider {
    border: none;
    border-top: 1px dashed #ddd;
    margin: 10px 0;
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 18px;
    color: #ff3f6c;
    padding-top: 4px;
}

.discount-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 14px;
    color: green;
}

/* ── BOTTOM BAR ── */
.bottom-bar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #fff;
    padding: 10px 12px;
    border-top: 1px solid #ddd;
    z-index: 999;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
}

.place-btn {
    width: 100%;
    background: #ff3f6c;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.3px;
    transition: background 0.2s;
}

.place-btn:hover {
    background: #e0305a;
}

/* ── EMPTY CART ── */
.empty-cart {
    text-align: center;
    padding: 70px 20px;
    color: #999;
}

.empty-cart h5 {
    margin-top: 15px;
    color: #444;
    font-weight: 600;
}

.empty-cart p {
    font-size: 14px;
    margin-bottom: 15px;
}

.shop-now-btn {
    background: #ff3f6c;
    color: #fff;
    border: none;
    padding: 10px 30px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    display: inline-block;
}

.shop-now-btn:hover {
    background: #e0305a;
    color: #fff;
}

/* ── SPACER ── */
.bottom-spacer {
    height: 85px;
}

/* ── PINCODE STATUS ── */
.pincode-status {
    font-size: 12px;
    margin-top: 4px;
    min-height: 16px;
}

.pincode-status.success { color: green; }
.pincode-status.error   { color: red;   }
</style>
</head>
<body>

<!-- LOCATION BAR -->
<div class="location-bar">
    📍 Deliver to: <span id="location-display">Hyderabad</span>
</div>

<!-- CART ITEMS -->
<div id="cart-items"></div>

<!-- DELIVERY ADDRESS FORM -->
<div class="section-card" id="delivery-section" style="display:none;">
    <h6>🏠 Delivery Address</h6>
    <div class="row g-3">

        <div class="col-12">
            <label class="form-label">Full Name *</label>
            <input type="text" id="full-name" class="form-control" placeholder="Enter your full name">
        </div>

        <div class="col-12">
            <label class="form-label">Mobile Number *</label>
            <input type="tel" id="mobile" class="form-control"
                   placeholder="10-digit mobile number" maxlength="10"
                   oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        </div>

        <div class="col-6">
            <label class="form-label">Pincode *</label>
            <input type="text" id="pincode" class="form-control"
                   placeholder="6-digit pincode" maxlength="6"
                   oninput="this.value=this.value.replace(/[^0-9]/g,''); fetchCity()">
            <div id="pincode-status" class="pincode-status"></div>
        </div>

        <div class="col-6">
            <label class="form-label">City</label>
            <input type="text" id="city" class="form-control"
                   placeholder="Auto-filled" readonly>
        </div>

        <div class="col-6">
            <label class="form-label">State</label>
            <input type="text" id="state" class="form-control"
                   placeholder="Auto-filled" readonly>
        </div>

        <div class="col-6">
            <label class="form-label">Locality *</label>
            <input type="text" id="locality" class="form-control"
                   placeholder="Area / Locality">
        </div>

        <div class="col-12">
            <label class="form-label">House / Flat / Building No. *</label>
            <input type="text" id="house-no" class="form-control"
                   placeholder="e.g. Flat 4B, Sunrise Apartments">
        </div>

        <div class="col-12">
            <label class="form-label">Street / Road Name</label>
            <input type="text" id="street" class="form-control"
                   placeholder="e.g. MG Road, Near Bus Stand">
        </div>

        <div class="col-12">
            <label class="form-label">Landmark (Optional)</label>
            <input type="text" id="landmark" class="form-control"
                   placeholder="e.g. Near Apollo Hospital">
        </div>

        <div class="col-12">
            <label class="form-label">Address Type</label>
            <div class="d-flex gap-4 mt-1">
                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="addrType" id="home-type" value="Home" checked>
                    <label class="form-check-label addr-type-label" for="home-type">🏠 Home</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="addrType" id="work-type" value="Work">
                    <label class="form-check-label addr-type-label" for="work-type">🏢 Work</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="addrType" id="other-type" value="Other">
                    <label class="form-check-label addr-type-label" for="other-type">📌 Other</label>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- PAYMENT METHOD -->
<div class="section-card" id="payment-section" style="display:none;">
    <h6>💳 Payment Method</h6>
    <div class="payment-option">
        <div class="payment-icon">✅</div>
        <div>
            <div class="payment-title">Cash on Delivery</div>
            <div class="payment-sub">Pay when your order arrives at your door</div>
        </div>
    </div>
</div>

<!-- ORDER SUMMARY -->
<div class="section-card" id="summary-section" style="display:none;">
    <h6>🧾 Order Summary</h6>

    <div class="summary-row">
        <span>Price (<span id="count">0</span> items)</span>
        <span>₹<span id="subtotal">0</span></span>
    </div>
    <div class="discount-row">
        <span>Delivery Charges</span>
        <span>FREE 🎉</span>
    </div>

    <hr class="summary-divider">

    <div class="total-row">
        <span>Total Amount</span>
        <span>₹<span id="total">0</span></span>
    </div>

    <div style="font-size:12px; color:#888; margin-top:8px;">
        🔒 Safe & Secure Checkout
    </div>
</div>

<!-- SPACER -->
<div class="bottom-spacer"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar" id="bottom-bar" style="display:none;">
    <button class="place-btn" onclick="placeOrder()">
        Place Order &nbsp;|&nbsp; ₹<span id="total-btn">0</span>
    </button>
</div>

<script>
// PARSE PRICE — handles ₹1,299 or 1299 or ₹1299
function parsePrice(priceStr) {
    if (!priceStr) return 0;
    let cleaned = String(priceStr).replace(/[₹,\s]/g, "").trim();
    let num = parseFloat(cleaned);
    return isNaN(num) ? 0 : num;
}

// AUTO-FILL CITY & STATE FROM PINCODE
function fetchCity() {
    let pin = document.getElementById("pincode").value.trim();
    let status = document.getElementById("pincode-status");

    if (pin.length === 6) {
        status.className = "pincode-status";
        status.innerText = "Fetching location...";

        fetch("https://api.postalpincode.in/pincode/" + pin)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data[0].Status === "Success") {
                    let info = data[0].PostOffice[0];
                    document.getElementById("city").value  = info.District;
                    document.getElementById("state").value = info.State;
                    status.className  = "pincode-status success";
                    status.innerText  = "✓ " + info.District + ", " + info.State;
                } else {
                    document.getElementById("city").value  = "";
                    document.getElementById("state").value = "";
                    status.className = "pincode-status error";
                    status.innerText = "✗ Invalid pincode";
                }
            })
            .catch(function() {
                status.className = "pincode-status error";
                status.innerText = "Could not fetch location";
            });
    } else {
        document.getElementById("pincode-status").innerText = "";
        document.getElementById("city").value  = "";
        document.getElementById("state").value = "";
    }
}

// RENDER CART
function renderCart() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cart-items");
    container.innerHTML = "";
    let total = 0;

    if (cart.length === 0) {
        container.innerHTML =
            '<div class="empty-cart">' +
                '<div style="font-size:64px;">🛍️</div>' +
                '<h5>Your bag is empty</h5>' +
                '<p>Looks like you haven\'t added anything yet</p>' +
                '<a href="main.html" class="shop-now-btn">Shop Now</a>' +
            '</div>';
        document.getElementById("delivery-section").style.display = "none";
        document.getElementById("payment-section").style.display  = "none";
        document.getElementById("summary-section").style.display  = "none";
        document.getElementById("bottom-bar").style.display       = "none";
        return;
    }

    for (let i = 0; i < cart.length; i++) {
        let item  = cart[i];
        let price = parsePrice(item.price);
        total += price;

        let div = document.createElement("div");
        div.className = "cart-card";
        div.innerHTML =
            '<img src="' + item.img + '" class="cart-img" ' +
                 'onerror="this.src=\'https://via.placeholder.com/100x120?text=No+Image\'">' +
            '<div class="cart-details">' +
                '<div class="cart-name">'  + (item.name || "Product") + '</div>' +
                (item.size ? '<div class="cart-size">Size: ' + item.size + '</div>' : '') +
                '<div class="cart-price">₹' + price.toLocaleString("en-IN") + '</div>' +
                '<button class="remove-btn" onclick="removeItem(' + i + ')">🗑 Remove</button>' +
            '</div>';
        container.appendChild(div);
    }

    document.getElementById("subtotal").innerText  = total.toLocaleString("en-IN");
    document.getElementById("total").innerText     = total.toLocaleString("en-IN");
    document.getElementById("total-btn").innerText = total.toLocaleString("en-IN");
    document.getElementById("count").innerText     = cart.length;

    document.getElementById("delivery-section").style.display = "block";
    document.getElementById("payment-section").style.display  = "block";
    document.getElementById("summary-section").style.display  = "block";
    document.getElementById("bottom-bar").style.display       = "block";
}

// REMOVE ITEM
function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

// VALIDATE FORM
function validateForm() {
    let name     = document.getElementById("full-name").value.trim();
    let mobile   = document.getElementById("mobile").value.trim();
    let pincode  = document.getElementById("pincode").value.trim();
    let houseNo  = document.getElementById("house-no").value.trim();
    let locality = document.getElementById("locality").value.trim();

    if (!name)                        { alert("Please enter your full name.");                  return false; }
    if (!/^\d{10}$/.test(mobile))     { alert("Please enter a valid 10-digit mobile number.");  return false; }
    if (!/^\d{6}$/.test(pincode))     { alert("Please enter a valid 6-digit pincode.");         return false; }
    if (!houseNo)                     { alert("Please enter your house / flat number.");        return false; }
    if (!locality)                    { alert("Please enter your locality / area.");            return false; }
    return true;
}

// PLACE ORDER
function placeOrder() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    if (cart.length === 0) { alert("Your cart is empty!"); return; }
    if (!validateForm()) return;

    let name     = document.getElementById("full-name").value.trim();
    let mobile   = document.getElementById("mobile").value.trim();
    let houseNo  = document.getElementById("house-no").value.trim();
    let street   = document.getElementById("street").value.trim();
    let locality = document.getElementById("locality").value.trim();
    let city     = document.getElementById("city").value.trim();
    let state    = document.getElementById("state").value.trim();
    let pincode  = document.getElementById("pincode").value.trim();
    let landmark = document.getElementById("landmark").value.trim();
    let addrType = document.querySelector('input[name="addrType"]:checked').value;
    let total    = document.getElementById("total").innerText;

    let address =
        houseNo + ", " +
        (street   ? street   + ", " : "") +
        locality  + ", " +
        (city     ? city     + ", " : "") +
        (state    ? state    + " - ": "") +
        pincode +
        (landmark ? " (Near " + landmark + ")" : "");

    alert(
        "✅ Order Placed Successfully!\n\n" +
        "👤 Name   : " + name     + "\n" +
        "📞 Mobile : " + mobile   + "\n" +
        "📍 Address (" + addrType + "):\n    " + address + "\n\n" +
        "💰 Total  : ₹" + total   + "\n" +
        "💵 Payment: Cash on Delivery\n\n" +
        "Thank you for shopping at RihaVastraa! 🛍️"
    );

    localStorage.removeItem("cart");
    window.location.href = "main.html";
}

// INITIAL LOAD
renderCart();
</script>

</body>
</html>
